<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر للمباراة | ALA TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-header {
            width: 100%;
            background-color: #8b1e24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .site-logo-box {
            background-color: #6b1419;
            padding: 8px 20px;
            border-radius: 6px;
            text-align: center;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .site-logo-box h1 { font-size: 18px; font-weight: 900; margin: 0; }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .match-card-top {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .match-league-title {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #8b1e24;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 6px;
        }

        .teams-box {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .team-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 130px;
            text-align: center;
        }

        .team-col img { width: 45px; height: 45px; object-fit: contain; }
        .team-col span { font-size: 14px; font-weight: 800; }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 1px solid #ccc;
        }

        .player-wrapper iframe { width: 100%; height: 100%; border: none; }

        /* أزرار السيرفرات والتحديث */
        .servers-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-server {
            flex: 1;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-server.active {
            background: #8b1e24;
            color: #fff;
            border-color: #8b1e24;
        }

        /* بانر المراهنات 1xBet بنفس الألوان الكلاسيكية المتناسقة */
        .xbet-classic-banner {
            background: linear-gradient(135deg, #0a1128 0%, #050b18 100%);
            border: 2px solid #ffc300;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .xbet-title { font-size: 18px; font-weight: 900; margin-bottom: 8px; color: #ffc300; }
        .xbet-desc { font-size: 13px; color: #d1d5db; margin-bottom: 14px; }

        .xbet-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .promo-box {
            background: #000;
            border: 1px dashed #ffc300;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 900;
            color: #ffc300;
            letter-spacing: 1px;
        }

        .btn-xbet-reg {
            background: #ffc300;
            color: #0b0f19;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 195, 0, 0.3);
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="site-logo-box">
            <h1>ALA TV</h1>
        </a>
    </header>

    <div class="container">
        <!-- معلومات المباراة -->
        <div class="match-card-top">
            <div class="match-league-title" id="leagueName">🏆 بطولة كرة القدم</div>
            <div class="teams-box">
                <div class="team-col">
                    <img id="team1Logo" src="https://via.placeholder.com/45" alt="الفريق الأول">
                    <span id="team1Name">الفريق الأول</span>
                </div>
                <div style="text-align:center;">
                    <span style="background:#8b1e24; color:#fff; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:800;">VS</span>
                    <div style="margin-top:6px; font-size:12px; font-weight:700; color:#6b7280;" id="matchTime">--:--</div>
                </div>
                <div class="team-col">
                    <img id="team2Logo" src="https://via.placeholder.com/45" alt="الفريق الثاني">
                    <span id="team2Name">الفريق الثاني</span>
                </div>
            </div>
        </div>

        <!-- شاشة البث -->
        <div class="player-wrapper">
            <iframe id="mainPlayer" src="about:blank" title="مشغل البث" allowfullscreen></iframe>
        </div>

        <!-- أزرار السيرفرات -->
        <div class="servers-row">
            <button class="btn-server active" id="btnFree" onclick="switchServer('free')">📺 السيرفر المجاني (HD)</button>
            <button class="btn-server" id="btnVip" onclick="switchServer('vip')">👑 سيرفر VIP (بدون تقطيع)</button>
        </div>

        <!-- بانر المراهنات 1xBet -->
        <section class="xbet-classic-banner">
            <div class="xbet-title">🔥 ضاعف رصيدك الأول حتى 200% مع 1xBet!</div>
            <p class="xbet-desc">سجّل الآن باستخدام كود البرومو واستفد من مكافأة ترحيبية فورية عند أول إيداع.</p>
            <div class="xbet-actions">
                <div class="promo-box">1x_6161996</div>
                <a href="https://refpa-78460.com/L?tag=d_6329886m_1599c_&site=6329886&ad=1599" target="_blank" rel="noopener noreferrer" class="btn-xbet-reg">سجّل واحصل على المكافأة ←</a>
            </div>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const team1 = decodeURIComponent(urlParams.get('team1') || 'الفريق الأول');
        const team2 = decodeURIComponent(urlParams.get('team2') || 'الفريق الثاني');
        const logo1 = decodeURIComponent(urlParams.get('logo1') || 'https://via.placeholder.com/45');
        const logo2 = decodeURIComponent(urlParams.get('logo2') || 'https://via.placeholder.com/45');
        const time = decodeURIComponent(urlParams.get('time') || '--:--');
        const league = decodeURIComponent(urlParams.get('league') || '🏆 مباراة مباشرة');

        document.getElementById("team1Name").innerText = team1;
        document.getElementById("team1Logo").src = logo1;
        document.getElementById("team2Name").innerText = team2;
        document.getElementById("team2Logo").src = logo2;
        document.getElementById("matchTime").innerText = time;
        document.getElementById("leagueName").innerText = league;
        document.title = `${team1} ضد ${team2} | بث مباشر ALA TV`;

        const freeStreamUrl = "about:blank"; 
        const vipStreamUrl = "about:blank";
        const player = document.getElementById("mainPlayer");
        player.src = freeStreamUrl;

        function switchServer(type) {
            const btnFree = document.getElementById("btnFree");
            const btnVip = document.getElementById("btnVip");
            if (type === 'free') {
                player.src = freeStreamUrl;
                btnFree.classList.add("active");
                btnVip.classList.remove("active");
            } else {
                player.src = vipStreamUrl;
                btnVip.classList.add("active");
                btnFree.classList.remove("active");
            }
        }
    </script>
</body>
</html>
