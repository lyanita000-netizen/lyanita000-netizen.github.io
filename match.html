<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA TV — البث المباشر للمباراة</title>

  <!-- كود Monetag OnClick Popunder -->
  <script id="monetag-popunder">(function(s){s.dataset.zone='12201455',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <style>
    :root {
      --bg: #07060f;
      --card-bg: #121021;
      --border: #262140;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ef4444;
      --gold: #f59e0b;
      --text: #ffffff;
      --muted: #9490ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 60px;
    }

    .navbar {
      background: rgba(11, 10, 22, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .btn-home {
      background: #1e1b38;
      border: 1px solid var(--border);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 14px;
    }

    /* رأس تفاصيل المباراة */
    .match-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .badge-live {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .teams-box {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .team-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 35%;
    }
    .team-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    .team-item span {
      font-size: 15px;
      font-weight: bold;
    }
    .vs-box {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
    }

    /* أزرار السيرفرات الربحية الذكية */
    .servers-panel {
      background: #141226;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .server-btn {
      background: #201b3b;
      color: #fff;
      border: 1px solid #3b3363;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .server-btn:hover, .server-btn.active {
      background: var(--primary);
      border-color: #a78bfa;
    }
    .server-btn.vip {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border: 0;
      color: #000;
    }

    /* شاشة مشغل البث المباشر */
    .player-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      aspect-ratio: 16 / 9;
    }
    .player-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* أزرار مساعدة أسفل المشغل */
    .player-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      background: #161426;
      border: 1px solid var(--border);
      color: #b3aed0;
      padding: 10px 0;
      text-align: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .action-btn:hover {
      background: #24203d;
      color: #fff;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">ALA TV</a>
    <a href="index.html" class="btn-home">← العودة للرئيسية</a>
  </nav>

  <div class="container">

    <!-- معلومات المباراة -->
    <div class="match-header">
      <div class="badge-live">🔴 سيرفر بث شغال 100%</div>
      <div class="teams-box">
        <div class="team-item">
          <img id="home-crest" src="https://crests.football-data.org/79.png" alt="فريق 1">
          <span id="home-title">الفريق المضيف</span>
        </div>
        <div class="vs-box">VS</div>
        <div class="team-item">
          <img id="away-crest" src="https://crests.football-data.org/81.png" alt="فريق 2">
          <span id="away-title">الفريق الضيف</span>
        </div>
      </div>
    </div>

    <!-- لوحة السيرفرات التفاعلية المرتبطة بالـ SmartLink -->
    <div class="servers-panel">
      <button class="server-btn active" onclick="switchServer(1, 'https://example.com/embed1')">⚡ سيرفر أساسي (HD)</button>
      <button class="server-btn" onclick="switchServer(2, 'https://example.com/embed2')">🌐 سيرفر متوسط (SD)</button>
      <button class="server-btn vip" onclick="openVipServer()">⭐ سيرفر 4K المشفر (VIP)</button>
      <button class="server-btn" onclick="refreshStream()">🔄 تحديث البث والصوت</button>
    </div>

    <!-- نافذة البث المباشر -->
    <div class="player-wrap">
      <iframe id="stream-frame" src="about:blank" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div class="player-actions">
      <div class="action-btn" onclick="triggerSmartAction('reload')">🔁 إعادة تحميل المشغل</div>
      <div class="action-btn" onclick="triggerSmartAction('report')">⚠️ الإبلاغ عن انقطاع البث</div>
      <div class="action-btn" onclick="triggerSmartAction('hd')">📺 جودة البث العالية</div>
    </div>

  </div>

  <script>
    // رابط الـ Direct Link الخاص بك من Monetag
    const DIRECT_LINK = "https://uplcm.com/4/12224226";

    // 1. فتح الرابط الربحي في تبويب جديد دون مقاطعة المشاهدة
    function triggerSmartAction(type) {
      window.open(DIRECT_LINK, '_blank');
      if (type === 'reload') {
        const frame = document.getElementById('stream-frame');
        frame.src = frame.src;
      }
    }

    function switchServer(serverNum, embedUrl) {
      // فتح الـ Direct Link كلما غير الزائر السيرفر
      window.open(DIRECT_LINK, '_blank');
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('stream-frame').src = embedUrl;
    }

    function openVipServer() {
      // نقرة ذات عائد عالي جداً لزر السيرفر VIP
      window.open(DIRECT_LINK, '_blank');
    }

    function refreshStream() {
      window.open(DIRECT_LINK, '_blank');
      const frame = document.getElementById('stream-frame');
      frame.src = frame.src;
    }

    // 2. نظام الإنعاش التلقائي للإعلانات (Ad Refresh) كل 3 دقائق
    // يضاعف عدد الظهور 15 مرة طوال مدة متابعة المباراة في الخلفية
    setInterval(() => {
      try {
        const oldScript = document.getElementById('monetag-popunder');
        if (oldScript) oldScript.remove();

        const newScript = document.createElement('script');
        newScript.id = 'monetag-popunder';
        newScript.dataset.zone = '12201455';
        newScript.src = 'https://al5sm.com/tag.min.js?refresh=' + Date.now();
        document.body.appendChild(newScript);
      } catch (err) {
        console.error("Ad refresh tick", err);
      }
    }, 180000); // 180,000 ميلي ثانية = 3 دقائق
  </script>

</body>
</html>
