<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">ALA TV | جدول المباريات والبث المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text-muted: #4b5563;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --text-color: #f9fafb;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        /* الهيدر المتجاوب */
        .main-header {
            width: 100%;
            background: linear-gradient(135deg, #7a161b 0%, #9e2329 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            padding: 16px 15px;
            box-sizing: border-box;
        }

        .header-inner {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 5px 9px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .nav-links-top {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .nav-links-top a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .nav-links-top a:hover {
            color: #ffc300;
        }

        /* مربع اللوجو ALA TV */
        .site-logo-box {
            background: linear-gradient(145deg, #5c1014, #7a161b);
            padding: 8px 22px;
            border-radius: 8px;
            text-align: center;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-logo-box h1 {
            font-size: 19px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* الحاوية العامة */
        .container {
            width: 100%;
            max-width: 850px;
            margin: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .tabs-bar {
            background-color: #8b1e24;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .tab-btn {
            background: #6b1419;
            border: none;
            color: #fff;
            padding: 10px 20px;
            min-width: 100px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #a9242b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* كارت المباراة منضبط داخل الإطار تماماً */
        .match-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .match-card:hover {
            border-color: #8b1e24;
            box-shadow: 0 4px 12px rgba(139, 30, 36, 0.15);
        }

        .match-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .team-box.left-side {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 38%;
            justify-content: flex-start;
            text-align: left;
        }

        .team-box.right-side {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 38%;
            justify-content: flex-end;
            text-align: right;
        }

        .team-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .team-name {
            font-size: 15px;
            font-weight: 800;
        }

        .match-center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 24%;
        }

        .match-time {
            font-size: 12.5px;
            font-weight: 700;
        }

        .status-badge {
            background: #1f2937;
            color: #fff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-badge.live {
            background: #dc2626;
            animation: pulse-red 1.2s infinite;
        }

        .status-badge.finished {
            background: #4b5563;
        }

        .match-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
            font-weight: 700;
            width: 100%;
        }

        .loading-box {
            text-align: center;
            padding: 35px;
            color: var(--text-muted);
            font-weight: 700;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* تحسينات خاصة بالهاتف المحمول لتتطابق تماماً بدون الخروج عن الإطار */
        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                gap: 12px;
            }
            .nav-links-top {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }
            .header-controls {
                order: 3;
            }
            .site-logo-box {
                order: 1;
                width: 100%;
                max-width: 200px;
            }
            .nav-links-top {
                order: 2;
            }
            .team-name {
                font-size: 13px;
            }
            .team-logo {
                width: 28px;
                height: 28px;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 12px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body id="bodyTag">

    <header class="main-header">
        <div class="header-inner">
            <div class="header-controls">
                <button class="control-btn" id="langBtn" onclick="toggleLanguage()">EN</button>
                <button class="control-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
            </div>

            <div class="nav-links-top">
                <a href="#" id="navNews">أخبار رياضية</a>
                <a href="#" id="navTomorrow">مباريات الغد</a>
                <a href="#" id="navToday">مباريات اليوم</a>
                <a href="#">yalla shoot</a>
            </div>

            <a href="index.html" class="site-logo-box">
                <h1>ALA TV</h1>
            </a>
        </div>
    </header>

    <div class="container">
        <div class="tabs-bar">
            <button class="tab-btn" id="btnYesterday" onclick="fetchMatches(-1, this)">مباريات الأمس</button>
            <button class="tab-btn active" id="btnTodayTab" onclick="fetchMatches(0, this)">مباريات اليوم</button>
            <button class="tab-btn" id="btnTomorrowTab" onclick="fetchMatches(1, this)">مباريات الغد</button>
        </div>

        <main id="matchesGrid" class="matches-list">
            <div class="loading-box" id="loadingText">⏳ جاري تحميل المباريات...</div>
        </main>
    </div>

    <script>
        const WORKER_URL = "https://ala-tv-api.lyanita000.workers.dev";
        let currentLang = localStorage.getItem('ala_lang') || 'ar';
        let currentTheme = localStorage.getItem('ala_theme') || 'light';

        if (currentTheme === 'dark') {
            document.getElementById('htmlRoot').setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').innerText = '☀️';
        }

        function toggleTheme() {
            if (currentTheme === 'light') {
                currentTheme = 'dark';
                document.getElementById('htmlRoot').setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').innerText = '☀️';
            } else {
                currentTheme = 'light';
                document.getElementById('htmlRoot').removeAttribute('data-theme');
                document.getElementById('themeBtn').innerText = '🌙';
            }
            localStorage.setItem('ala_theme', currentTheme);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('ala_lang', currentLang);
            updateUIText();
            fetchMatches(0, document.querySelector('.tab-btn.active'));
        }

        function updateUIText() {
            const isEn = currentLang === 'en';
            document.getElementById('langBtn').innerText = isEn ? 'AR' : 'EN';
            document.getElementById('navNews').innerText = isEn ? 'Sports News' : 'أخبار رياضية';
            document.getElementById('navTomorrow').innerText = isEn ? 'Tomorrow Matches' : 'مباريات الغد';
            document.getElementById('navToday').innerText = isEn ? 'Today Matches' : 'مباريات اليوم';
            document.getElementById('btnYesterday').innerText = isEn ? 'Yesterday' : 'مباريات الأمس';
            document.getElementById('btnTodayTab').innerText = isEn ? 'Today' : 'مباريات اليوم';
            document.getElementById('btnTomorrowTab').innerText = isEn ? 'Tomorrow' : 'مباريات الغد';
            document.documentElement.setAttribute('dir', isEn ? 'ltr' : 'rtl');
        }

        updateUIText();

        function getLocalDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        }

        function formatMatchTime(utcDateStr) {
            if (!utcDateStr) return "06:00 PM";
            const date = new Date(utcDateStr);
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: true, 
                timeZone: 'Africa/Algiers' 
            });
        }

        async function fetchMatches(offsetDays, btnElement) {
            const grid = document.getElementById("matchesGrid");
            const isEn = currentLang === 'en';
            grid.innerHTML = `<div class="loading-box">${isEn ? '⏳ Loading matches...' : '⏳ جاري تحديث الجدول...'}</div>`;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const dateStr = getLocalDate(offsetDays);

            try {
                const response = await fetch(`${WORKER_URL}/fixtures?date=${dateStr}`);
                if (!response.ok) throw new Error("Worker Error");
                
                let matches = await response.json();

                if (!Array.isArray(matches) || matches.length === 0) {
                    grid.innerHTML = `<div class="loading-box">${isEn ? 'No matches scheduled for today.' : 'لا توجد مباريات مسجلة لهذا اليوم.'}</div>`;
                    return;
                }

                matches.sort((a, b) => {
                    const statusOrder = { "IN_PLAY": 1, "SCHEDULED": 2, "PAUSED": 2, "FINISHED": 3 };
                    const orderA = statusOrder[a.status] || 2;
                    const orderB = statusOrder[b.status] || 2;
                    if (orderA !== orderB) return orderA - orderB;
                    return (Date.parse(a.utcDate) || 0) - (Date.parse(b.utcDate) || 0);
                });

                grid.innerHTML = '';
                matches.forEach(m => {
                    const homeName = m.homeTeam?.name || "Team 1";
                    const awayName = m.awayTeam?.name || "Team 2";
                    const homeLogo = m.homeTeam?.crest || "https://placehold.co/40x40?text=FC";
                    const awayLogo = m.awayTeam?.crest || "https://placehold.co/40x40?text=FC";
                    const league = m.competition?.name || "Football Match";
                    const timeFormatted = formatMatchTime(m.utcDate);

                    let statusText = isEn ? "Not Started" : "لم تبدأ بعد";
                    let badgeClass = "";

                    if (m.status === "IN_PLAY") {
                        statusText = isEn ? `Live (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})` : `مباشر (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        badgeClass = "live";
                    } else if (m.status === "FINISHED") {
                        statusText = isEn ? `Finished (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})` : `انتهت (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        badgeClass = "finished";
                    }

                    const matchUrl = `match.html?id=${m.id}&team1=${encodeURIComponent(homeName)}&team2=${encodeURIComponent(awayName)}&logo1=${encodeURIComponent(homeLogo)}&logo2=${encodeURIComponent(awayLogo)}&time=${encodeURIComponent(timeFormatted)}&league=${encodeURIComponent(league)}`;

                    const card = `
                        <a href="${matchUrl}" class="match-card">
                            <div class="match-main-row">
                                <div class="team-box left-side">
                                    <span class="team-name">${homeName}</span>
                                    <img src="${homeLogo}" alt="${homeName}" class="team-logo" onerror="this.src='https://placehold.co/40x40?text=FC'">
                                </div>
                                <div class="match-center-info">
                                    <span class="match-time">${timeFormatted}</span>
                                    <span class="status-badge ${badgeClass}">${statusText}</span>
                                </div>
                                <div class="team-box right-side">
                                    <img src="${awayLogo}" alt="${awayName}" class="team-logo" onerror="this.src='https://placehold.co/40x40?text=FC'">
                                    <span class="team-name">${awayName}</span>
                                </div>
                            </div>
                            <div class="match-footer-row">
                                <span>🏆 ${league}</span>
                                <span>🎤 ${m.commentator || (isEn ? 'Unknown' : 'حفيظ دراجي')}</span>
                                <span>${m.channel || 'Bein Sports HD1'} 📺</span>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });

            } catch (err) {
                grid.innerHTML = `<div class="loading-box">⚠️ ${isEn ? 'Failed to load matches.' : 'تعذر تحميل المباريات.'}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMatches(0, document.querySelectorAll('.tab-btn')[1]);
        });
    </script>
</body>
</html>
