<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALA TV | جدول المباريات والبث المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #0e1322;
            --card-border: #1a233a;
            --accent-glow: #00d2ff;
            --btn-purple: #7c3aed;
            --btn-purple-hover: #6d28d9;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --live-red: #ff334b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px 40px 20px;
        }

        .navbar {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
        }

        .logo span { color: var(--accent-glow); }

        .hero-banner {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(135deg, #10172d 0%, #0a0e1c 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hero-banner h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
        .hero-banner p { color: var(--text-muted); font-size: 13.5px; }

        .tabs-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: #0e1322;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 22px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .matches-grid {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .match-card:hover { border-color: var(--accent-glow); }

        .match-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 38%;
        }

        .team:nth-child(3) {
            justify-content: flex-end;
            text-align: left;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .team-name {
            font-size: 15px;
            font-weight: 800;
        }

        .match-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 24%;
        }

        .match-status {
            background: #141d33;
            color: var(--accent-glow);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .match-status.live {
            background: rgba(255, 51, 75, 0.15);
            border-color: var(--live-red);
            color: var(--live-red);
            animation: pulse-red 1.5s infinite;
        }

        .match-footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .btn-details {
            background: var(--btn-purple);
            color: #fff;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            transition: background 0.2s;
        }

        .btn-details:hover { background: var(--btn-purple-hover); }

        .loading-box {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">ALA <span>TV</span></a>
    </nav>

    <section class="hero-banner">
        <h1>جدول مباريات اليوم والبث المباشر</h1>
        <p>تابع أحق وأهم المواجهات الكروية بأعلى جودة وبدون تقطيع.</p>
    </section>

    <div class="tabs-row">
        <button class="tab-btn" onclick="fetchMatches(-1, this)">مباريات الأمس</button>
        <button class="tab-btn active" onclick="fetchMatches(0, this)">مباريات اليوم</button>
        <button class="tab-btn" onclick="fetchMatches(1, this)">مباريات الغد</button>
    </div>

    <main id="matchesGrid" class="matches-grid">
        <div class="loading-box">⏳ جاري تحميل المباريات والبطولات...</div>
    </main>

    <script>
        const WORKER_URL = "https://ala-tv-api.lyanita000.workers.dev";

        function getLocalDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        }

        function formatMatchTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            return date.toLocaleTimeString('ar-DZ', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: true, 
                timeZone: 'Africa/Algiers' 
            });
        }

        async function fetchMatches(offsetDays, btnElement) {
            const grid = document.getElementById("matchesGrid");
            grid.innerHTML = '<div class="loading-box">⏳ جاري تحديث الرزنامة...</div>';

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const dateStr = getLocalDate(offsetDays);

            try {
                const response = await fetch(`${WORKER_URL}/fixtures?date=${dateStr}`);
                if (!response.ok) throw new Error("Worker Error");
                
                const matches = await response.json();

                if (!Array.isArray(matches) || matches.length === 0) {
                    grid.innerHTML = '<div class="loading-box">لا توجد مباريات مسجلة لهذا اليوم.</div>';
                    return;
                }

                grid.innerHTML = '';
                matches.forEach(m => {
                    const homeName = m.homeTeam?.name || "الفريق الأول";
                    const awayName = m.awayTeam?.name || "الفريق الثاني";
                    const homeLogo = m.homeTeam?.crest || "https://placehold.co/40x40?text=FC";
                    const awayLogo = m.awayTeam?.crest || "https://placehold.co/40x40?text=FC";
                    const league = m.competition?.name || "🏆 مباراة مباشرة";
                    const time = formatMatchTime(m.utcDate);

                    let statusBadge = `⏰ ${time}`;
                    let vsDisplay = "VS";

                    if (m.status === "IN_PLAY") {
                        statusBadge = `🔴 مباشر (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        vsDisplay = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                    } else if (m.status === "FINISHED") {
                        statusBadge = `انتهت (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        vsDisplay = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                    }

                    const card = `
                        <div class="match-card">
                            <div class="match-header-info">
                                <span>🏆 ${league}</span>
                                <span>🎤 المعلق: ${m.commentator || 'غير محدد'}</span>
                            </div>
                            <div class="teams-row">
                                <div class="team">
                                    <img src="${homeLogo}" alt="${homeName}" class="team-logo" onerror="this.src='https://placehold.co/40x40?text=FC'">
                                    <span class="team-name">${homeName}</span>
                                </div>
                                <div class="match-center">
                                    <div class="match-status ${m.status === 'IN_PLAY' ? 'live' : ''}">${statusBadge}</div>
                                    <span style="font-weight: 900; color: var(--accent-glow);">${vsDisplay}</span>
                                </div>
                                <div class="team">
                                    <span class="team-name">${awayName}</span>
                                    <img src="${awayLogo}" alt="${awayName}" class="team-logo" onerror="this.src='https://placehold.co/40x40?text=FC'">
                                </div>
                            </div>
                            <div class="match-footer-bar">
                                <span>📺 القناة الناقلة: <strong>${m.channel || 'Bein Sports'}</strong></span>
                                <a href="match.html?id=${m.id}&team1=${encodeURIComponent(homeName)}&team2=${encodeURIComponent(awayName)}&logo1=${encodeURIComponent(homeLogo)}&logo2=${encodeURIComponent(awayLogo)}&time=${encodeURIComponent(time)}&league=${encodeURIComponent(league)}" class="btn-details">مشاهدة البث ←</a>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });

            } catch (err) {
                grid.innerHTML = '<div class="`loading-box`">⚠️ تعذر تحميل المباريات. تأكد من اتصال الـ Worker.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMatches(0, document.querySelectorAll('.tab-btn')[1]);
        });
    </script>
</body>
</html>
