<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA TV — عالم كرة القدم وبث المباريات</title>
  <style>
    :root {
      --bg: #07060f;
      --card-bg: #121021;
      --border: #262140;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ef4444;
      --text: #ffffff;
      --muted: #9490ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 60px;
    }

    /* شريط التنقل العلوي */
    .navbar {
      background: rgba(11, 10, 22, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .btn-lang {
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: bold;
      text-decoration: none;
    }

    .main-wrap {
      max-width: 950px;
      margin: 20px auto 0;
      padding: 0 14px;
    }

    /* البانر الترحيبي */
    .hero-banner {
      background: linear-gradient(180deg, #1d173b 0%, #121024 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .hero-banner h1 {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
    }
    .hero-banner p {
      font-size: 13px;
      color: #b5b0ce;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* أزرار السوشيال والتطبيق */
    .action-banners {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      transition: transform 0.2s;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .btn-tg { background: linear-gradient(135deg, #0088cc, #00aaff); }
    .btn-android { background: linear-gradient(135deg, #15803d, #22c55e); }
    .btn-ios { background: linear-gradient(135deg, #1e293b, #475569); border: 1px solid #475569; }

    /* تبويبات الأيام */
    .day-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .tab-btn {
      background: #17142a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { border-color: var(--primary); color: #fff; }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: #a78bfa;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
    }

    .tab-pane { display: none; }
    .tab-pane.active {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    /* بطاقات المباريات */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badge-status {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 20px;
      margin: 0 auto 14px;
      width: fit-content;
    }
    .badge-live {
      background: var(--accent);
      color: #fff;
      animation: pulse 1.8s infinite;
    }
    .badge-upcoming {
      background: #2a254d;
      color: #c4b5fd;
      border: 1px solid #433b73;
    }
    .badge-ended {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .teams-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 14px;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .team img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }
    .team span { font-size: 14px; font-weight: 700; }
    .match-mid {
      min-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .vs-text { font-size: 15px; font-weight: 900; color: var(--muted); }
    .match-time { font-size: 17px; font-weight: 900; color: #fff; }
    .league-info { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .btn-watch {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 11px 0;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn-watch:hover { background: var(--primary-hover); }
    .btn-watch.ended { background: #24203d; color: #a39eb8; }

    .no-matches {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
      font-size: 14px;
      grid-column: 1 / -1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @media (max-width: 600px) {
      .nav-links { display: none; }
      .navbar { padding: 12px 16px; }
      .hero-banner h1 { font-size: 21px; }
      .day-tabs { gap: 6px; }
      .tab-btn { padding: 9px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">ALA TV</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">الرئيسية</a></li>
      <li><a href="#schedule">المباريات</a></li>
      <li><a href="match.html">البث المباشر</a></li>
    </ul>
    <a href="#" class="btn-lang">Français</a>
  </nav>

  <div class="main-wrap">

    <header class="hero-banner">
      <h1>عالم كرة القدم مع ALA TV</h1>
      <p>تابع مباريات كرة القدم ومواعيدها ونتائجها وشاهد البث المباشر في مكان واحد بدون تقطيع وبأعلى جودة.</p>
    </header>

    <section class="action-banners">
      <a href="https://t.me/ALATV_LIVE_STREAM" target="_blank" rel="noopener noreferrer" class="action-btn btn-tg">
        <span>📢 انضم لقناة التيليغرام</span>
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.walid.kooralive" target="_blank" rel="noopener noreferrer" class="action-btn btn-android">
        <span>🤖 تطبيق كورة لايف (Android)</span>
      </a>
      <a href="https://apps.apple.com/app/id6805597332" target="_blank" rel="noopener noreferrer" class="action-btn btn-ios">
        <span>🍏 تطبيق المشاهدة (iOS)</span>
      </a>
    </section>

    <div class="day-tabs" id="schedule">
      <button class="tab-btn" onclick="openDay('yesterday', this)">مباريات الأمس</button>
      <button class="tab-btn active" onclick="openDay('today', this)">مباريات اليوم</button>
      <button class="tab-btn" onclick="openDay('tomorrow', this)">مباريات الغد</button>
    </div>

    <main id="yesterday" class="tab-pane"></main>
    <main id="today" class="tab-pane active"></main>
    <main id="tomorrow" class="tab-pane"></main>

  </div>

  <script>
    // جلب ملف المباريات matches.json وتوزيعها تلقائياً
    async function loadMatches() {
      try {
        const response = await fetch('matches.json?t=' + Date.now());
        const matchesData = await response.json();
        renderMatches(matchesData);
      } catch (err) {
        console.error("فشل تحميل المباريات:", err);
      }
    }

    function renderMatches(matchesData) {
      const now = new Date();
      const yesterdayContainer = document.getElementById('yesterday');
      const todayContainer = document.getElementById('today');
      const tomorrowContainer = document.getElementById('tomorrow');

      yesterdayContainer.innerHTML = '';
      todayContainer.innerHTML = '';
      tomorrowContainer.innerHTML = '';

      matchesData.forEach(match => {
        const matchTime = new Date(match.matchDate);
        const diffMs = matchTime - now;
        const diffHours = diffMs / (1000 * 60 * 60);

        const isToday = matchTime.toDateString() === now.toDateString();
        const yesterdayDate = new Date(now);
        yesterdayDate.setDate(now.getDate() - 1);
        const isYesterday = matchTime.toDateString() === yesterdayDate.toDateString();
        
        const tomorrowDate = new Date(now);
        tomorrowDate.setDate(now.getDate() + 1);
        const isTomorrow = matchTime.toDateString() === tomorrowDate.toDateString();

        let badgeHtml = '';
        let buttonText = 'مشاهدة البث المباشر ←';
        let buttonClass = 'btn-watch';
        let midHtml = '';

        if (diffHours < -2.2 || isYesterday) {
          badgeHtml = '<div class="badge-status badge-ended">انتهت المباراة</div>';
          buttonText = 'تفاصيل وملخص المباراة ←';
          buttonClass = 'btn-watch ended';
          midHtml = `<span class="match-time">${match.result || 'انتهت'}</span>`;
        } else if (diffHours <= 0 && diffHours >= -2.2) {
          badgeHtml = '<div class="badge-status badge-live">🔴 مباشر الآن</div>';
          buttonText = 'مشاهدة البث المباشر ←';
          midHtml = `<span class="vs-text">VS</span><span class="match-time">مباشر</span>`;
        } else {
          const hours = String(matchTime.getHours()).padStart(2, '0');
          const minutes = String(matchTime.getMinutes()).padStart(2, '0');
          badgeHtml = `<div class="badge-status badge-upcoming">⏰ ${hours}:${minutes}</div>`;
          buttonText = 'تفاصيل وموعد البث ←';
          midHtml = `<span class="vs-text">VS</span><span class="match-time">${hours}:${minutes}</span>`;
        }

        const card = `
          <div class="match-card">
            ${badgeHtml}
            <div class="teams-grid">
              <div class="team">
                <img src="${match.homeLogo}" alt="${match.homeTeam}">
                <span>${match.homeTeam}</span>
              </div>
              <div class="match-mid">
                ${midHtml}
              </div>
              <div class="team">
                <img src="${match.awayLogo}" alt="${match.awayTeam}">
                <span>${match.awayTeam}</span>
              </div>
            </div>
            <div class="league-info">${match.league}</div>
            <a href="${match.link}" class="${buttonClass}">${buttonText}</a>
          </div>
        `;

        if (isYesterday || diffHours < -2.2) {
          yesterdayContainer.innerHTML += card;
        } else if (isToday) {
          todayContainer.innerHTML += card;
        } else if (isTomorrow || diffHours > 0) {
          tomorrowContainer.innerHTML += card;
        }
      });

      if (!yesterdayContainer.innerHTML) yesterdayContainer.innerHTML = '<div class="no-matches">لا توجد مباريات مسجلة للأمس.</div>';
      if (!todayContainer.innerHTML) todayContainer.innerHTML = '<div class="no-matches">لا توجد مباريات متبقية لليوم.</div>';
      if (!tomorrowContainer.innerHTML) tomorrowContainer.innerHTML = '<div class="no-matches">لا توجد مباريات مسجلة للغد بعد.</div>';
    }

    function openDay(dayId, btn) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(dayId).classList.add('active');
      btn.classList.add('active');
    }

    loadMatches();
  </script>

</body>
</html>
