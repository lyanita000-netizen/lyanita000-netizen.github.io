<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA TV — بث مباشر لمباريات اليوم</title>
  <style>
    :root {
      --bg: #0b0a16;
      --card-bg: #141226;
      --border: #282347;
      --primary: #8b5cf6;
      --accent: #ef4444;
      --text: #ffffff;
      --muted: #9490ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 12px 50px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    .header h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: var(--muted);
    }
    .matches-container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* بطاقة المباراة الكبيرة */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .badge-status {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .badge-live {
      background: var(--accent);
      color: #fff;
      animation: pulse 1.8s infinite;
    }
    .badge-upcoming {
      background: #2a254d;
      color: #c4b5fd;
      border: 1px solid #433b73;
    }
    .teams-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 14px;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .team img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }
    .team span {
      font-size: 14px;
      font-weight: 700;
    }
    .match-mid {
      min-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .vs-text {
      font-size: 16px;
      font-weight: 900;
      color: var(--muted);
    }
    .match-time {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .league-info {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .btn-watch {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 12px 0;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn-watch:hover {
      background: #7c3aed;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>ALA TV</h1>
    <p>بث مباشر لجميع مباريات اليوم بدون تقطيع</p>
  </header>

  <main class="matches-container">

    <!-- كرت مباراة 1 (مباشر الآن) -->
    <div class="match-card">
      <div class="badge-status badge-live">🔴 مباشر الآن</div>
      <div class="teams-grid">
        <div class="team">
          <img src="https://crests.football-data.org/79.png" alt="أتلتيكو مدريد">
          <span>أتلتيكو مدريد</span>
        </div>
        <div class="match-mid">
          <span class="vs-text">VS</span>
          <span class="match-time">21:00</span>
        </div>
        <div class="team">
          <img src="https://crests.football-data.org/81.png" alt="برشلونة">
          <span>برشلونة</span>
        </div>
      </div>
      <div class="league-info">🏆 الدوري الإسباني — الجولة 28</div>
      <!-- رابط الانتقال لصفحة البث الخاصة بها -->
      <a href="match.html" class="btn-watch">مشاهدة البث المباشر ←</a>
    </div>

    <!-- كرت مباراة 2 (لم تبدأ) -->
    <div class="match-card">
      <div class="badge-status badge-upcoming">⏰ لم تبدأ بعد</div>
      <div class="teams-grid">
        <div class="team">
          <img src="https://crests.football-data.org/108.png" alt="إنتر ميلان">
          <span>إنتر ميلان</span>
        </div>
        <div class="match-mid">
          <span class="vs-text">VS</span>
          <span class="match-time">18:30</span>
        </div>
        <div class="team">
          <img src="https://crests.football-data.org/586.png" alt="تورينو">
          <span>تورينو</span>
        </div>
      </div>
      <div class="league-info">🏆 الدوري الإيطالي — الجولة 26</div>
      <a href="match.html" class="btn-watch">تفاصيل وموعد البث ←</a>
    </div>

  </main>

</body>
</html>
