<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALA TV | جدول المباريات والبث المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #0e1322;
            --card-border: #1a233a;
            --accent-blue: #0088ff;
            --accent-glow: #00d2ff;
            --btn-purple: #7c3aed;
            --btn-purple-hover: #6d28d9;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --match-time-bg: #141d33;
            --match-time-text: #c7d2fe;
            --live-red: #ff334b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px 40px 20px;
        }

        .navbar {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-glow);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #fff;
        }

        .lang-badge {
            background: #4f46e5;
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .hero-banner {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(135deg, #10172d 0%, #0a0e1c 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-banner h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .channel-links {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn-link {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s;
        }

        .btn-link:hover {
            transform: translateY(-2px);
        }

        .btn-telegram { background: #0088cc; color: #fff; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); }
        .btn-android { background: #10b981; color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-ios { background: #12192d; color: #d1d5db; border: 1px solid #22304f; }

        .tabs-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .tab-btn {
            background: #0e1322;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .matches-grid {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s, transform 0.2s;
        }

        .match-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .match-badge-time {
            align-self: center;
            background: var(--match-time-bg);
            color: var(--match-time-text);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(0, 210, 255, 0.1);
        }

        .match-badge-time.live {
            background: rgba(255, 51, 75, 0.15);
            border: 1px solid var(--live-red);
            color: var(--live-red);
            animation: pulse-red 1.5s infinite;
        }

        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 110px;
            text-align: center;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .team-name {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
        }

        .vs-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vs-text {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-glow);
        }

        .vs-time {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }

        .match-league {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .btn-match-details {
            display: block;
            width: 100%;
            background: var(--btn-purple);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 800;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-match-details:hover {
            background: var(--btn-purple-hover);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .loading-box {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .channel-links { grid-template-columns: 1fr; }
            .matches-grid { grid-template-columns: 1fr; }
            .loading-box { grid-column: span 1; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="lang-badge">Français</a>
        <div class="nav-links">
            <a href="match.html">البث المباشر</a>
            <a href="#">المباريات</a>
            <a href="#" class="active">الرئيسية</a>
        </div>
        <a href="index.html" class="logo">ALA <span>TV</span></a>
    </nav>

    <section class="hero-banner">
        <h1>عالم كرة القدم مع ALA TV</h1>
        <p>تابع مباريات كرة القدم ومواعيدها ونتائجها وشاهد البث المباشر في مكان واحد بدون تقطيع وبأعلى جودة.</p>
    </section>

    <div class="channel-links">
        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-link btn-telegram">📢 انضم لقناة التيليغرام</a>
        <a href="#" class="btn-link btn-android">📱 تطبيق كورة لايف (Android)</a>
        <a href="#" class="btn-link btn-ios">🍏 تطبيق المشاهدة (iOS)</a>
    </div>

    <!-- أزرار تبديل الأيام -->
    <div class="tabs-row">
        <button class="tab-btn" onclick="fetchMatches(-1, this)">مباريات الأمس</button>
        <button class="tab-btn active" onclick="fetchMatches(0, this)">مباريات اليوم</button>
        <button class="tab-btn" onclick="fetchMatches(1, this)">مباريات الغد</button>
    </div>

    <!-- شبكة عرض المباريات التلقائية -->
    <main id="matchesGrid" class="matches-grid">
        <div class="loading-box">⏳ جاري الاتصال بالـ Worker وجلب المباريات...</div>
    </main>

    <!-- الجافاسكريبت المربوط بـ Worker الخاص بك مباشرة -->
    <script>
        const WORKER_URL = "https://ala-tv-api.lyanita000.workers.dev";

        function getLocalDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        }

        function formatMatchTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            return date.toLocaleTimeString('ar-DZ', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: true, 
                timeZone: 'Africa/Algiers' 
            });
        }

        async function fetchMatches(offsetDays, btnElement) {
            const grid = document.getElementById("matchesGrid");
            grid.innerHTML = '<div class="loading-box">⏳ جاري تحديث قائمة المباريات...</div>';

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const dateStr = getLocalDate(offsetDays);

            try {
                const response = await fetch(`${WORKER_URL}/fixtures?date=${dateStr}`);
                if (!response.ok) throw new Error("Worker Error");
                
                const matches = await response.json();

                if (!Array.isArray(matches) || matches.length === 0) {
                    grid.innerHTML = '<div class="loading-box">لا توجد مباريات مسجلة لهذا اليوم.</div>';
                    return;
                }

                grid.innerHTML = '';
                matches.forEach(m => {
                    const homeName = m.homeTeam?.name || "الفريق الأول";
                    const awayName = m.awayTeam?.name || "الفريق الثاني";
                    const homeLogo = m.homeTeam?.crest || "https://placehold.co/48x48?text=FC";
                    const awayLogo = m.awayTeam?.crest || "https://placehold.co/48x48?text=FC";
                    const league = m.competition?.name || "🏆 مباراة مباشرة";
                    const time = formatMatchTime(m.utcDate);

                    let statusBadge = `⏰ ${time}`;
                    let vsDisplay = "VS";

                    if (m.status === "IN_PLAY") {
                        statusBadge = `🔴 مباشر الآن (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        vsDisplay = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                    } else if (m.status === "FINISHED") {
                        statusBadge = `انتهت (${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0})`;
                        vsDisplay = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                    }

                    const card = `
                        <div class="match-card">
                            <div class="match-badge-time ${m.status === 'IN_PLAY' ? 'live' : ''}">${statusBadge}</div>
                            <div class="teams-row">
                                <div class="team">
                                    <img src="${homeLogo}" alt="${homeName}" class="team-logo" onerror="this.src='https://placehold.co/48x48?text=FC'">
                                    <span class="team-name">${homeName}</span>
                                </div>
                                <div class="vs-block">
                                    <span class="vs-text">${vsDisplay}</span>
                                    <span class="vs-time">${time}</span>
                                </div>
                                <div class="team">
                                    <img src="${awayLogo}" alt="${awayName}" class="team-logo" onerror="this.src='https://placehold.co/48x48?text=FC'">
                                    <span class="team-name">${awayName}</span>
                                </div>
                            </div>
                            <div class="match-league">${league}</div>
                            <a href="match.html?id=${m.id}&team1=${encodeURIComponent(homeName)}&team2=${encodeURIComponent(awayName)}&logo1=${encodeURIComponent(homeLogo)}&logo2=${encodeURIComponent(awayLogo)}&time=${encodeURIComponent(time)}&league=${encodeURIComponent(league)}" class="btn-match-details">تفاصيل وموعد البث ←</a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });

            } catch (err) {
                grid.innerHTML = '<div class="loading-box">⚠️ تعذر تحميل المباريات. تأكد من إعداد المفاتيح داخل Cloudflare Worker.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMatches(0, document.querySelectorAll('.tab-btn')[1]);
        });
    </script>

    <!-- نظام إعلانات Monetag الموقوتة بـ 10 دقائق -->
    <script>
    (function() {
        const COOLDOWN_MS = 10 * 60 * 1000;

        function canShow(key) {
            const last = localStorage.getItem(key);
            if (!last) return true;
            return (Date.now() - parseInt(last, 10)) > COOLDOWN_MS;
        }

        const VIGNETTE_KEY = 'monetag_vignette_time';
        if (canShow(VIGNETTE_KEY)) {
            localStorage.setItem(VIGNETTE_KEY, Date.now().toString());
            const vScript = document.createElement('script');
            vScript.dataset.zone = '12224250';
            vScript.src = 'https://n6wxm.com/vignette.min.js';
            (document.body || document.documentElement).appendChild(vScript);
        }

        const POPUNDER_KEY = 'monetag_popunder_time';
        document.addEventListener('click', function triggerPopunder() {
            if (canShow(POPUNDER_KEY)) {
                localStorage.setItem(POPUNDER_KEY, Date.now().toString());
                const pScript = document.createElement('script');
                pScript.dataset.zone = '12201455';
                pScript.src = 'https://al5sm.com/tag.min.js';
                (document.body || document.documentElement).appendChild(pScript);
            }
        }, { once: true });
    })();
    </script>
</body>
</html>
