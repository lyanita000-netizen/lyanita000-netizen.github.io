<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALATV | مباريات اليوم والبث المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121826;
            --card-border: #1e293b;
            --accent-blue: #0077b6;
            --accent-glow: #00b4d8;
            --btn-purple: #6d28d9;
            --btn-purple-hover: #5b21b6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --match-time-bg: #1e1b4b;
            --match-time-text: #c7d2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px 40px 20px;
        }

        .navbar {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-glow);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #fff;
        }

        .lang-badge {
            background: #4f46e5;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .hero-banner {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(180deg, #161c2e 0%, #101524 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-banner h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .channel-links {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn-link {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, opacity 0.2s;
        }

        .btn-link:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-android { background: #10b981; color: #fff; }
        .btn-ios { background: #1f2937; color: #d1d5db; border: 1px solid #374151; }

        .tabs-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .tab-btn {
            background: #161e2e;
            border: 1px solid #283548;
            color: var(--text-muted);
            padding: 9px 22px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .matches-grid {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s;
        }

        .match-card:hover {
            border-color: #3b82f6;
        }

        .match-badge-time {
            align-self: center;
            background: var(--match-time-bg);
            color: var(--match-time-text);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 110px;
            text-align: center;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .team-name {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
        }

        .vs-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vs-text {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-muted);
        }

        .vs-time {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }

        .match-league {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-match-details {
            display: block;
            width: 100%;
            background: var(--btn-purple);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            transition: background 0.2s;
        }

        .btn-match-details:hover {
            background: var(--btn-purple-hover);
        }

        .loading-box {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .channel-links { grid-template-columns: 1fr; }
            .matches-grid { grid-template-columns: 1fr; }
            .loading-box { grid-column: span 1; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="lang-badge">Français</a>
        <div class="nav-links">
            <a href="match.html">البث المباشر</a>
            <a href="#">المباريات</a>
            <a href="#" class="active">الرئيسية</a>
        </div>
        <a href="index.html" class="logo">ALA <span>TV</span></a>
    </nav>

    <section class="hero-banner">
        <h1>عالم كرة القدم مع ALA TV</h1>
        <p>تابع مباريات كرة القدم ومواعيدها ونتائجها وشاهد البث المباشر في مكان واحد بدون تقطيع وبأعلى جودة.</p>
    </section>

    <div class="channel-links">
        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-link btn-telegram">📢 انضم لقناة التيليغرام</a>
        <a href="#" class="btn-link btn-android">📱 تطبيق كورة لايف (Android)</a>
        <a href="#" class="btn-link btn-ios">🍏 تطبيق المشاهدة (iOS)</a>
    </div>

    <!-- أزرار الأيام -->
    <div class="tabs-row">
        <button class="tab-btn" onclick="fetchMatchesByDay(-1, this)">مباريات الأمس</button>
        <button class="tab-btn active" onclick="fetchMatchesByDay(0, this)">مباريات اليوم</button>
        <button class="tab-btn" onclick="fetchMatchesByDay(1, this)">مباريات الغد</button>
    </div>

    <!-- شبكة عرض المباريات التلقائية -->
    <main id="matchesGrid" class="matches-grid">
        <div class="loading-box">⏳ جاري جلب المباريات المباشرة وتحديث البيانات...</div>
    </main>

    <!-- جافاسكريبت: الربط التلقائي بـ Score API والترجمة الفورية -->
    <script>
        // قاموس تعريب أسماء الأندية الشائعة
        const teamTranslations = {
            "Real Madrid": "ريال مدريد", "Barcelona": "برشلونة", "Liverpool": "ليفربول",
            "Manchester City": "مانشستر سيتي", "Manchester United": "مانشستر يونايتد",
            "Arsenal": "أرسنال", "Chelsea": "تشيلسي", "Bayern Munich": "بايرن ميونخ",
            "Borussia Dortmund": "بوروسيا دورتموند", "Paris Saint Germain": "باريس سان جيرمان",
            "Juventus": "يوفنتوس", "AC Milan": "ميلان", "Inter": "إنتر ميلان",
            "Atletico Madrid": "أتلتيكو مدريد", "Al Ahly": "الأهلي", "Zamalek": "الزمالك",
            "Wadi Degla": "وادي دجلة", "Minyat Samanoud": "منية سمنود", "Plymouth Parkway": "بليموث باركواي",
            "Berkhamsted": "بيركهامستيد"
        };

        function translateTeam(name) {
            for (const [en, ar] of Object.entries(teamTranslations)) {
                if (name.toLowerCase().includes(en.toLowerCase())) return ar;
            }
            return name;
        }

        // تنسيق التاريخ بصيغة YYYY-MM-DD
        function getDateString(offsetDays) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        }

        // تحويل وقت المباراة إلى توقيت محلي بالعربية
        function formatMatchTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        // جلب المباريات من API مفتوح ومحدث تلقائياً
        async function fetchMatchesByDay(offsetDays, btnElement) {
            const grid = document.getElementById("matchesGrid");
            grid.innerHTML = '<div class="loading-box">⏳ جاري تحديث المباريات...</div>';

            // تبديل الزر النشط
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const dateStr = getDateString(offsetDays);

            try {
                // جلب المباريات من واجهة كرة القدم العالمية
                const response = await fetch(`https://api.openfoot.org/v1/matches?date=${dateStr}`);
                const data = await response.json();
                const matches = data.matches || data.data || [];

                if (!matches || matches.length === 0) {
                    grid.innerHTML = '<div class="loading-box">لا توجد مباريات مسجلة لهذا اليوم.</div>';
                    return;
                }

                grid.innerHTML = '';
                matches.forEach(m => {
                    const homeTeam = translateTeam(m.homeTeam?.name || m.team_home || "الفريق الأول");
                    const awayTeam = translateTeam(m.awayTeam?.name || m.team_away || "الفريق الثاني");
                    const homeLogo = m.homeTeam?.logo || m.homeTeam?.crest || "https://placehold.co/48x48?text=FC";
                    const awayLogo = m.awayTeam?.logo || m.awayTeam?.crest || "https://placehold.co/48x48?text=FC";
                    const time = formatMatchTime(m.utcDate || m.datetime || m.time);
                    const league = m.competition?.name || m.league_name || "🏆 مباراة مباشرة";
                    const matchId = m.id || Math.floor(Math.random() * 1000);

                    const card = `
                        <div class="match-card">
                            <div class="match-badge-time">⏰ ${time}</div>
                            <div class="teams-row">
                                <div class="team">
                                    <img src="${homeLogo}" alt="${homeTeam}" class="team-logo" onerror="this.src='https://placehold.co/48x48?text=FC'">
                                    <span class="team-name">${homeTeam}</span>
                                </div>
                                <div class="vs-block">
                                    <span class="vs-text">VS</span>
                                    <span class="vs-time">${time}</span>
                                </div>
                                <div class="team">
                                    <img src="${awayLogo}" alt="${awayTeam}" class="team-logo" onerror="this.src='https://placehold.co/48x48?text=FC'">
                                    <span class="team-name">${awayTeam}</span>
                                </div>
                            </div>
                            <div class="match-league">${league}</div>
                            <a href="match.html?id=${matchId}&team1=${encodeURIComponent(homeTeam)}&team2=${encodeURIComponent(awayTeam)}&time=${encodeURIComponent(time)}&league=${encodeURIComponent(league)}" class="btn-match-details">تفاصيل وموعد البث ←</a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (err) {
                grid.innerHTML = '<div class="loading-box">⚠️ تعذر تحميل المباريات مباشرة، يرجى إعادة المحاولة لاحقاً.</div>';
            }
        }

        // بدء الجلب التلقائي لليوم عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            fetchMatchesByDay(0, document.querySelectorAll('.tab-btn')[1]);
        });
    </script>

    <!-- نظام إعلانات Monetag الموقوتة بـ 10 دقائق -->
    <script>
    (function() {
        const COOLDOWN_MS = 10 * 60 * 1000;

        function canShow(key) {
            const last = localStorage.getItem(key);
            if (!last) return true;
            return (Date.now() - parseInt(last, 10)) > COOLDOWN_MS;
        }

        // 1. إعلان Vignette Banner (Zone 12224250)
        const VIGNETTE_KEY = 'monetag_vignette_time';
        if (canShow(VIGNETTE_KEY)) {
            localStorage.setItem(VIGNETTE_KEY, Date.now().toString());
            const vScript = document.createElement('script');
            vScript.dataset.zone = '12224250';
            vScript.src = 'https://n6wxm.com/vignette.min.js';
            (document.body || document.documentElement).appendChild(vScript);
        }

        // 2. إعلان Popunder (Zone 12201455)
        const POPUNDER_KEY = 'monetag_popunder_time';
        document.addEventListener('click', function triggerPopunder() {
            if (canShow(POPUNDER_KEY)) {
                localStorage.setItem(POPUNDER_KEY, Date.now().toString());
                const pScript = document.createElement('script');
                pScript.dataset.zone = '12201455';
                pScript.src = 'https://al5sm.com/tag.min.js';
                (document.body || document.documentElement).appendChild(pScript);
            }
        }, { once: true });
    })();
    </script>
</body>
</html>
